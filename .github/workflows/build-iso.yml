name: Build MAC OS Live ISO

on:
  workflow_dispatch:
  push:
    paths:
      - "config/**"
      - "scripts/build-iso.sh"
      - "scripts/verify-iso.sh"
      - "scripts/test-verify-iso.sh"
      - "scripts/run-vm.sh"
      - "scripts/validate-native.sh"
      - "shell/gnome-extension/**"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

concurrency:
  group: mac-iso-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate source files
        run: |
          bash -n scripts/build-iso.sh
          bash -n scripts/verify-iso.sh
          bash -n scripts/test-verify-iso.sh
          bash scripts/test-verify-iso.sh
          bash -n scripts/run-vm.sh
          bash scripts/validate-native.sh
          if grep -nF '\n' scripts/build-iso.sh; then echo 'Unexpected literal backslash-n in build script'; exit 1; fi
          node --input-type=module --check < shell/gnome-extension/extension.js
          node --input-type=module --check < shell/gnome-extension/prefs.js
          node --check app.js
          python3 -m json.tool shell/gnome-extension/metadata.json >/dev/null
          python3 -c 'import configparser; p=configparser.ConfigParser(interpolation=None); p.read("config/includes.chroot/usr/share/applications/mac-desktop-settings.desktop"); assert p.get("Desktop Entry", "Exec").startswith("gnome-extensions prefs ")'
          cmp shell/gnome-extension/extension.js config/includes.chroot/usr/share/gnome-shell/extensions/mac-shell@macos-project/extension.js
          cmp shell/gnome-extension/prefs.js config/includes.chroot/usr/share/gnome-shell/extensions/mac-shell@macos-project/prefs.js
          cmp shell/gnome-extension/stylesheet.css config/includes.chroot/usr/share/gnome-shell/extensions/mac-shell@macos-project/stylesheet.css
          cmp shell/gnome-extension/metadata.json config/includes.chroot/usr/share/gnome-shell/extensions/mac-shell@macos-project/metadata.json
          cmp shell/gnome-extension/schemas/org.gnome.shell.extensions.mac-shell.gschema.xml config/includes.chroot/usr/share/gnome-shell/extensions/mac-shell@macos-project/schemas/org.gnome.shell.extensions.mac-shell.gschema.xml
          python3 -c 'import xml.etree.ElementTree as ET; ET.parse("config/includes.chroot/usr/share/backgrounds/mac/mac-wallpaper.svg"); ET.parse("config/includes.chroot/usr/share/icons/hicolor/scalable/apps/mac-desktop-settings.svg"); ET.parse("shell/gnome-extension/schemas/org.gnome.shell.extensions.mac-shell.gschema.xml")'

      - name: Install ISO verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso

      - name: Build ISO with Debian Trixie live-build
        run: |
          docker run --rm --privileged -v "$GITHUB_WORKSPACE:/workspace" -w /workspace debian:trixie bash -euxc '
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates git live-build debootstrap debian-archive-keyring xorriso genisoimage squashfs-tools grub-pc-bin grub-efi-amd64-bin mtools nodejs python3 libglib2.0-bin
            git config --global --add safe.directory /workspace
            lb --version
            bash ./scripts/build-iso.sh
          '
      - name: Verify generated ISO
        run: bash ./scripts/verify-iso.sh MAC-OS-amd64.iso

      - name: Write build summary
        if: always()
        run: |
          echo "## MAC OS ISO build" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f MAC-OS-build-manifest.txt ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`text" >> "$GITHUB_STEP_SUMMARY"
            cat MAC-OS-build-manifest.txt >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Manifest not generated; build likely failed before ISO creation." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload ISO, checksum, and manifest
        uses: actions/upload-artifact@v4
        with:
          name: MAC-OS-live-amd64
          path: |
            MAC-OS-amd64.iso
            MAC-OS-amd64.iso.sha256
            MAC-OS-build-manifest.txt
          if-no-files-found: error
          retention-days: 7
