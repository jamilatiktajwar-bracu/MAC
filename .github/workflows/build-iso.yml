name: Build MAC OS Live ISO

on:
  workflow_dispatch:
  push:
    paths:
      - "config/**"
      - "scripts/build-iso.sh"
      - "shell/gnome-extension/**"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

concurrency:
  group: mac-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate source files
        run: |
          bash -n scripts/build-iso.sh
          node --input-type=module --check < shell/gnome-extension/extension.js
          node --check app.js
          python3 -m json.tool shell/gnome-extension/metadata.json >/dev/null
          cmp shell/gnome-extension/extension.js config/includes.chroot/usr/share/gnome-shell/extensions/mac-shell@macos-project/extension.js
          cmp shell/gnome-extension/stylesheet.css config/includes.chroot/usr/share/gnome-shell/extensions/mac-shell@macos-project/stylesheet.css
          cmp shell/gnome-extension/metadata.json config/includes.chroot/usr/share/gnome-shell/extensions/mac-shell@macos-project/metadata.json
          python3 -c 'import xml.etree.ElementTree as ET; ET.parse("config/includes.chroot/usr/share/backgrounds/mac/mac-wallpaper.svg")'

      - name: Install live-build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap debian-archive-keyring xorriso squashfs-tools grub-pc-bin grub-efi-amd64-bin mtools

      - name: Build ISO
        run: sudo bash ./scripts/build-iso.sh

      - name: Write build summary
        if: always()
        run: |
          echo "## MAC OS ISO build" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f MAC-OS-build-manifest.txt ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`text" >> "$GITHUB_STEP_SUMMARY"
            cat MAC-OS-build-manifest.txt >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Manifest not generated; build likely failed before ISO creation." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload ISO, checksum, and manifest
        uses: actions/upload-artifact@v4
        with:
          name: MAC-OS-live-amd64
          path: |
            MAC-OS-amd64.iso
            MAC-OS-amd64.iso.sha256
            MAC-OS-build-manifest.txt
          if-no-files-found: error
          retention-days: 7
